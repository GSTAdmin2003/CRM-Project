; =============================================================================
; Asterisk Dialplan for CRM VoIP
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

; -----------------------------------------------------------------------------
; Internal context for outbound calls
; -----------------------------------------------------------------------------
[from-internal]
; Outbound calls via trunk
exten => _X.,1,NoOp(Outbound call to ${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=hangup-handler,s,1)
 same => n,MixMonitor(${UNIQUEID}.wav,br(${UNIQUEID}-rx.wav)t(${UNIQUEID}-tx.wav))
 same => n,Dial(PJSIP/${EXTEN}@sip-trunk-endpoint,60)
 same => n,Hangup()

; -----------------------------------------------------------------------------
; Inbound calls from trunk
; -----------------------------------------------------------------------------
[from-trunk]
; Inbound calls from trunk
; Some providers send extension 's', others send the DID number
exten => _X.,1,Goto(from-trunk-ring,s,1)
exten => s,1,Goto(from-trunk-ring,s,1)

; [from-trunk-ring] is dynamically generated and included from:
#include "/etc/asterisk/dynamic/extensions_custom.conf"

; -----------------------------------------------------------------------------
; Hangup handler for cleanup
; -----------------------------------------------------------------------------
[hangup-handler]
exten => s,1,NoOp(Call ended: ${UNIQUEID})
 same => n,Return()
