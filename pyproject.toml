[tool.black]
line-length = 99
target-version = ["py312"]

[tool.isort]
profile = "django"
known_first_party = ["core", "apps"]
line_length = 99

[tool.mypy]
python_version = "3.12"
django_settings_module = "core.settings"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apps/", "core/"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "core/asgi.py",
    "core/wsgi.py",
    "manage.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]
