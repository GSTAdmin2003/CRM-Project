; =============================================================================
; PJSIP Configuration for CRM VoIP
; =============================================================================

; -----------------------------------------------------------------------------
; Transports
; -----------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=EXTERNAL_IP_PLACEHOLDER
external_signaling_address=EXTERNAL_IP_PLACEHOLDER

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=127.0.0.1
external_signaling_address=127.0.0.1

; -----------------------------------------------------------------------------
; Agent extensions (WebRTC)
; Agents connect from the browser via SIP.js over WebSocket.
; Loaded dynamically so the CRM can manage them.
; -----------------------------------------------------------------------------
#include "/etc/asterisk/dynamic/pjsip_agents.conf"

; -----------------------------------------------------------------------------
; SIP Trunk - loaded dynamically from /etc/asterisk/dynamic/pjsip_trunk.conf
; This file is generated by the CRM when users save SIP credentials.
; -----------------------------------------------------------------------------
#include "/etc/asterisk/dynamic/pjsip_trunk.conf"
