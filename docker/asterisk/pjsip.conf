; =============================================================================
; PJSIP Configuration for CRM VoIP
; =============================================================================

; -----------------------------------------------------------------------------
; Transport
; -----------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; -----------------------------------------------------------------------------
; Internal endpoint for web users (WebRTC or softphones)
; -----------------------------------------------------------------------------
[webrtc-endpoint]
type=endpoint
context=from-internal
disallow=all
allow=opus
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes

; -----------------------------------------------------------------------------
; SIP Trunk - loaded dynamically from /etc/asterisk/dynamic/pjsip_trunk.conf
; This file is generated by the CRM when users save SIP credentials.
; -----------------------------------------------------------------------------
#include "/etc/asterisk/dynamic/pjsip_trunk.conf"
