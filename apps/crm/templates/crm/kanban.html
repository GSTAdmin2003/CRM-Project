{% extends 'base.html' %}
{% load django_vite %}

{% block title %}Opportunity Pipeline - CRM System{% endblock %}

{% block extra_head %}
{% vite_asset 'src/entries/kanban.js' %}
{% endblock %}

{% block content %}
<script id="kanban-init-data" type="application/json">
{
    "viewContext": "{{ view_context }}",
    "selectedTeamId": "{{ selected_team_id|default:'all' }}",
    "userTeamId": "{{ user_team_id|default:'' }}",
    "isManager": {% if user.is_sales_manager %}true{% else %}false{% endif %},
    "isExecutive": {% if user.is_sales_executive %}true{% else %}false{% endif %},
    "availableTeams": [{% for t in available_teams %}{"id":{{ t.id }},"name":"{{ t.name|escapejs }}"}{% if not forloop.last %},{% endif %}{% endfor %}],
    "apiUrls": {
        "kanban": "{% url 'crm:api_kanban' %}",
        "leadStage": "/crm/api/opportunities/{leadId}/stage/",
        "opportunityEdit": "/crm/opportunities/{leadId}/edit/",
        "opportunityCreate": "{% url 'crm:opportunity_create' %}"
    }
}
</script>
<div id="svelte-kanban-root"></div>
{% endblock %}

{% block extra_js %}{% endblock %}
