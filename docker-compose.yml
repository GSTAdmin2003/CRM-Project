services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - asterisk_recordings:/var/spool/asterisk/monitor
      - asterisk_config:/etc/asterisk/dynamic
      - custom_moh:/var/lib/asterisk/custom-moh
      - custom_sounds:/var/lib/asterisk/custom-sounds
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ASTERISK_ARI_URL=http://asterisk:8088
      - ASTERISK_ARI_USER=${ARI_USER:-crm}
      - ASTERISK_ARI_PASSWORD=${ARI_PASSWORD}
      - ASTERISK_RECORDINGS_PATH=/var/spool/asterisk/monitor
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - asterisk
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload --reload-dir /app"

  asterisk:
    build: ./docker/asterisk
    ports:
      - "5060:5060/udp"    # SIP
      - "8088:8088"        # ARI HTTP/WebSocket
      - "10000-10100:10000-10100/udp"  # RTP media
    volumes:
      - asterisk_recordings:/var/spool/asterisk/monitor
      - asterisk_config:/etc/asterisk/dynamic
      - custom_moh:/var/lib/asterisk/custom-moh
      - custom_sounds:/var/lib/asterisk/custom-sounds
    environment:
      - TZ=${TZ:-Asia/Tbilisi}
      - ARI_PASSWORD=${ARI_PASSWORD}
      - WEBRTC_AGENT_PASSWORD=${WEBRTC_AGENT_PASSWORD:-changeme}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery:
    build: .
    command: celery -A core worker -l info
    volumes:
      - .:/app
      - asterisk_recordings:/var/spool/asterisk/monitor
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ASTERISK_ARI_URL=http://asterisk:8088
      - ASTERISK_ARI_USER=${ARI_USER:-crm}
      - ASTERISK_ARI_PASSWORD=${ARI_PASSWORD}
      - ASTERISK_RECORDINGS_PATH=/var/spool/asterisk/monitor
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - asterisk

  celery-beat:
    build: .
    command: celery -A core beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  ari-handler:
    build: .
    command: python manage.py run_ari_handler
    restart: unless-stopped
    volumes:
      - .:/app
      - asterisk_recordings:/var/spool/asterisk/monitor
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ASTERISK_ARI_URL=http://asterisk:8088
      - ASTERISK_ARI_USER=${ARI_USER:-crm}
      - ASTERISK_ARI_PASSWORD=${ARI_PASSWORD}
      - ASTERISK_RECORDINGS_PATH=/var/spool/asterisk/monitor
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - asterisk

volumes:
  postgres_data:
  asterisk_recordings:
  asterisk_config:
  custom_moh:
  custom_sounds:
  redis_data:
